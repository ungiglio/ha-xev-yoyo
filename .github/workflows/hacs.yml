name: HACS Validation
permissions:
  contents: read
  
on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v7

      - name: HACS Action
        uses: hacs/action@22.5.0
        with:
          category: integration